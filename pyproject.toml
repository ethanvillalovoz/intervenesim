[project]
name = "intervenesim"
version = "0.1.0"
description = "A reproducible benchmark for intervention-guided recovery in simulated robot manipulation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Ethan Villalovoz" }]
dependencies = [
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "matplotlib>=3.10,<4",
  "mujoco==3.3.7",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "robosuite>=1.5.1,<1.6",
  "seaborn>=0.13,<1",
  "tabulate>=0.9,<1",
  "torch>=2.7,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
intervenesim = "intervenesim.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intervenesim"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
